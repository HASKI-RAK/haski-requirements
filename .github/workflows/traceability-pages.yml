name: Traceability --> GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  pages: write       # für deploy-pages
  id-token: write    # für OIDC

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  rtm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requirements
        uses: actions/checkout@v4

      - name: Download latest frontend test artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          repo: ${{ github.repository_owner }}/HASKI-Frontend
          workflow: test-report.yml
          branch: main
          name: jest-results
          path: frontend_artifact
          if_no_artifact_found: warn

      - name: Download latest backend test artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          repo: ${{ github.repository_owner }}/HASKI-Backend
          workflow: test-report.yml
          branch: main
          name: pytest-report
          path: backend_artifact
          if_no_artifact_found: warn

      - name: Place test reports in expected locations
        run: |
          mkdir -p frontend/reports backend/reports
          if [ -f frontend_artifact/jest-results.json ]; then
            cp frontend_artifact/jest-results.json frontend/reports/jest-results.json
          else
            echo '{"testResults": []}' > frontend/reports/jest-results.json
          fi
          if [ -f backend_artifact/pytest-report.json ]; then
            cp backend_artifact/pytest-report.json backend/reports/pytest-report.json
          else
            echo '{"tests": []}' > backend/reports/pytest-report.json
          fi

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Generate docs tree (incl. traceability)
        run: python scripts/generate_docs.py

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: rtm
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
